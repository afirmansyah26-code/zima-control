services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: zima-control-center/api:latest
    container_name: zcc-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/registry.db}
      HOST: ${API_HOST:-0.0.0.0}
      PORT: ${API_PORT:-3000}
      NODE_ENV: production
      MUTATION_CAPABILITY_MODE: ${MUTATION_CAPABILITY_MODE:-DISABLED}
      APPLICATION_RUNTIME_SOCKET_PATH: /run/zcc/application-runtime.sock
      TRUST_FORWARDED_PROTO: "true"
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - registry-data:/data
      - ${RUNTIME_SOCKET_PATH:-/run/zcc/application-runtime.sock}:/run/zcc/application-runtime.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/ready').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: zima-control-center/web:latest
    container_name: zcc-web
    environment:
      API_UPSTREAM_HOST: api
      API_UPSTREAM_PORT: ${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: zima-control-center/worker:latest
    container_name: zcc-worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/registry.db}
      ZIMAOS_BASE_URL: ${ZIMAOS_BASE_URL:?ZIMAOS_BASE_URL is required}
      OBSERVATION_INTERVAL_MS: ${OBSERVATION_INTERVAL_MS:-30000}
      APPLICATION_RUNTIME_SOCKET_PATH: /run/zcc/application-runtime.sock
      NODE_ENV: production
    volumes:
      - registry-data:/data
      - ${RUNTIME_SOCKET_PATH:-/run/zcc/application-runtime.sock}:/run/zcc/application-runtime.sock
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  registry-data:
