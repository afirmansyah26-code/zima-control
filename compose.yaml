services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must reference the persistent registry SQLite file}
      HOST: ${API_HOST:-0.0.0.0}
      PORT: ${API_PORT:-3000}
    volumes:
      - registry-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM_HOST: api
      API_UPSTREAM_PORT: ${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must reference the persistent registry SQLite file}
      ZIMAOS_BASE_URL: ${ZIMAOS_BASE_URL:?ZIMAOS_BASE_URL is required}
    volumes:
      - registry-data:/data
    restart: "no"

volumes:
  registry-data:
